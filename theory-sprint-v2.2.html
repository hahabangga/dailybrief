<script>
const PATCH="(()=>{\n  const getScene=(id)=>{\n    if(typeof THEORY_COURSES==='undefined') return null;\n    for(const course of THEORY_COURSES){\n      const scene=(course.scenes||[]).find(s=>s.id===id);\n      if(scene) return {course,scene};\n    }\n    return null;\n  };\n  const set=(id,fn)=>{\n    const hit=getScene(id);\n    if(!hit) return false;\n    fn(hit.scene,hit.course);\n    return true;\n  };\n  const applied=[];\n\n  if(set('pp-doc-periods',(s)=>{\n    s.memory='[[DIE 1~15·5년·2월 / DPG 0~7·매년·3월 / JSOP 3~7·F+1 2월]]';\n    s.rows=(s.rows||[]).map(r=>r[0]==='JSOP'\n      ? ['JSOP','합참 전략기획본부 / F+3∼F+7 / 매년 F+1 2월 말']\n      : r);\n    s.source=[...new Set([...(s.source||[]),'FD26'])];\n  })) applied.push('JSOP 발간시기: 12월 → F+1년 2월 말');\n\n  if(set('rq-screen',(s)=>{\n    s.lead='합참은 소요검토요청서와 국방연의 통합소요분석자료 등을 검토해 통합소요기획 대상 전력 등을 선정하고 합동전략회의에 상정한다.';\n    s.memory='[[요청서 + 통합소요분석 → 대상전력 선정 → 합동전략회의]]';\n    s.rows=[\n      ['고려','군사적 효용성·국방재원·기술수준·분석 및 연구수행능력'],\n      ['정책','국방전략·정책·합동군사전략서·국방기획지침의 군사력 건설방향'],\n      ['시급성','전력의 시급성을 함께 고려'],\n      ['절차','이 경우 합동전략실무회의는 생략']\n    ];\n  })) applied.push('통합소요검토회의 설명을 제14조제4항 기준으로 교정');\n\n  if(set('rq-rapid',(s)=>{\n    s.rows=(s.rows||[]).map(r=>r[0]==='선행연구'\n      ? ['선행연구','신속소요는 선행연구를 거치지 않고 방위력개선사업 추진방법을 결정할 수 있음']\n      : r);\n  })) applied.push('신속소요 선행연구 예외 요건 교정');\n\n  if(set('rq-emergency',(s)=>{\n    s.lead='사변·해외파병·침투·도발·테러, 명백하고 현저한 적 위협, 예기치 못한 도태·치명적 결함에 따른 작전공백, 시범운용을 통해 신기술의 군 활용성이 확인된 경우에는 긴급소요로 결정할 수 있다.';\n    s.memory='[[긴급사정 / 현저한 위협 / 전력공백 / 시범운용 적합]]';\n    s.rows=[\n      ['결정','합참이 긴급소요 해당 여부를 판단'],\n      ['사유1','사변·해외파병·침투·도발·테러 등 긴급사정'],\n      ['사유2','명백·현저한 적 위협 또는 예기치 못한 도태·치명적 결함'],\n      ['예외','긴급소요는 선행연구 없이 추진방법 결정 가능']\n    ];\n  })) applied.push('긴급소요 사유를 제14조의3 기준으로 재정렬');\n\n  if(set('rq-decision',(s)=>{\n    s.lead='합참은 전력소요서(안)을 작성하고 관련기관 검토와 통합개념팀의 종합검토를 거쳐 합동참모회의 심의·의결로 소요를 결정한다. 위임대상은 각군 참모총장·해병대사령관이 자체 절차로 결정할 수 있다.';\n    s.memory='[[전력소요서안 → 관련기관 검토·통합개념
