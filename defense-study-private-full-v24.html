async function openApp(){const e=document.getElementById('err');e.textContent='';const pw=document.getElementById('pw').value;if(!pw){e.textContent='비밀번호를 입력해 주세요.';return}try{const enc=new TextEncoder();const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64ToBytes(SALT),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(NONCE),additionalData:enc.encode(AAD)},key,b64ToBytes(CIPHERTEXT));document.open();document.write(new TextDecoder().decode(plain));document.close()}catch(x){e.textContent='비밀번호가 맞지 않습니다.'}}
