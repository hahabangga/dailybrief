<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173b32">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Theory Sprint · 검증 이론</title>
  <style>
    :root{--ink:#14231f;--muted:#68746f;--paper:#f3f1e8;--card:#fffdf7;--line:#d9ded7;--accent:#246b58;--soft:#dcefe7;--warn:#a3542d;--scene-time:13000ms;--teach-time:6000ms;--blink-cycle:2000ms;--blink-count:3}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
    button,a{font:inherit}.shell{width:min(860px,100%);min-height:100dvh;margin:auto;padding:env(safe-area-inset-top) 16px calc(92px + env(safe-area-inset-bottom))}
    .top{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 13px}.brand{font-size:1.12rem;font-weight:950;letter-spacing:-.055em}.brand i{font-style:normal;color:var(--accent)}.version{font-size:.72rem;font-weight:850;color:var(--muted);background:#e8ebe5;padding:5px 9px;border-radius:99px}
    .hero,.course-card,.scene-card,.finish{background:var(--card);border:1px solid var(--line);box-shadow:0 14px 45px rgba(23,59,50,.06);border-radius:24px}.hero{padding:clamp(24px,6vw,42px);margin-bottom:14px}.eyebrow{font-size:.73rem;letter-spacing:.12em;font-weight:950;color:var(--accent)}
    h1,h2,p{margin-top:0}h1{font-size:clamp(2.15rem,8vw,4rem);line-height:1.03;letter-spacing:-.075em;margin:10px 0 16px}h2{font-size:clamp(1.72rem,6vw,3rem);line-height:1.13;letter-spacing:-.06em;margin:7px 0 18px}.sub{color:var(--muted);font-size:1rem;max-width:650px;margin-bottom:0}
    .principles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px}.principle{background:#edf1eb;padding:12px;border-radius:14px}.principle b{display:block;font-size:1rem}.principle small{color:var(--muted);font-weight:750}.timing-launch{width:100%;margin-top:10px;border:1px solid #c7d2cc;background:#f8fbf7;color:var(--ink);border-radius:14px;padding:12px;font-weight:900;cursor:pointer}
    .major-group{margin:28px 0 34px}.major-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 5px 8px}.major-kicker{font-size:.72rem;font-weight:950;letter-spacing:.11em;color:var(--accent)}.major-title{font-size:clamp(1.3rem,4.5vw,1.85rem);font-weight:950;letter-spacing:-.055em;line-height:1.15;margin-top:4px}.major-count{white-space:nowrap;color:var(--muted);font-size:.73rem;font-weight:850}.course-card{padding:20px;margin-top:12px;position:relative;overflow:hidden}.course-card:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--course)}.course-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}.course-no{font-size:.73rem;font-weight:950;color:var(--course);letter-spacing:.08em}.course-title{font-size:1.28rem;font-weight:950;letter-spacing:-.045em;margin:3px 0 5px}.course-copy{color:var(--muted);font-size:.9rem;margin:0}.audit{white-space:nowrap;font-size:.7rem;font-weight:900;color:#496159;background:#edf2ee;border-radius:99px;padding:5px 8px}.mode-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.start{border:0;border-radius:14px;padding:13px 10px;font-weight:900;cursor:pointer}.start.core{background:var(--course);color:white}.start.full{background:#edf0eb;color:var(--ink);border:1px solid var(--line)}
    .resume{width:100%;border:1px solid #bfcbc4;background:#f7faf6;color:var(--ink);border-radius:15px;padding:13px;font-weight:900;margin-top:12px;cursor:pointer}.method{margin:18px 3px 0;color:var(--muted);font-size:.82rem}.method b{color:var(--ink)}
    .lecture-head{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(14px);padding:12px 0 9px}.lecture-top{display:flex;align-items:center;gap:9px}.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:12px;width:42px;height:42px;font-weight:950;cursor:pointer}.lecture-name{min-width:0;flex:1}.lecture-name b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.03em}.lecture-name small{display:block;color:var(--muted);font-size:.72rem}.count{font-size:.78rem;font-weight:950;color:var(--accent)}
    .chapter-strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:9px 0 7px}.chapter-strip::-webkit-scrollbar{display:none}.chapter{white-space:nowrap;border-radius:99px;background:#e7eae5;color:#6d7772;padding:5px 9px;font-size:.68rem;font-weight:900}.chapter.on{background:var(--soft);color:var(--accent)}
    .progress{height:5px;background:#dde2dc;border-radius:9px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--accent);transition:width .25s}.timer-line{height:2px;overflow:hidden;margin-top:2px}.timer-line i{display:block;height:100%;width:0;background:color-mix(in srgb,var(--accent) 55%,transparent);animation:timebar var(--scene-time) linear forwards}
    .scene-card{padding:clamp(23px,6vw,46px);min-height:min(680px,calc(100dvh - 190px));display:flex;flex-direction:column;cursor:pointer;animation:enter .32s ease-out}.scene-meta{display:flex;justify-content:space-between;align-items:center;gap:12px}.chapter-label{font-size:.74rem;font-weight:950;color:var(--accent);letter-spacing:.08em}.priority{font-size:.68rem;color:var(--muted);font-weight:850}.lead{font-size:clamp(1.05rem,3.6vw,1.32rem);line-height:1.68;letter-spacing:-.025em}.memory{margin:18px 0 17px;padding:18px 16px;background:var(--soft);border-radius:18px;font-size:clamp(1.18rem,4.5vw,1.72rem);line-height:1.5;font-weight:820;letter-spacing:-.035em}.memory:before{content:"기억 문장";display:block;color:var(--accent);font-size:.67rem;letter-spacing:.12em;margin-bottom:7px}
    .memory-key{display:inline;padding:0 .08em;color:var(--accent);font-weight:950;border-radius:5px;animation:keyblinkDynamic var(--blink-cycle) linear var(--blink-count) var(--teach-time)}.facts{border:1px solid var(--line);border-radius:17px;overflow:hidden;margin-top:2px}.fact{display:grid;grid-template-columns:minmax(78px,112px) 1fr;border-bottom:1px solid var(--line)}.fact:last-child{border-bottom:0}.fact b{padding:11px 12px;background:#eef2ed;color:var(--accent);font-size:.78rem}.fact span{padding:11px 12px;font-size:.87rem}.learning-sequence{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 13px;color:var(--muted);font-size:.7rem;font-weight:850}.learning-sequence b{color:var(--accent);background:var(--soft);padding:4px 7px;border-radius:99px}.source-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:18px}.source-chip{border:1px solid var(--line);color:var(--muted);background:#fafaf5;text-decoration:none;border-radius:99px;padding:5px 9px;font-size:.67rem;font-weight:820}.tap-hint{text-align:center;color:var(--muted);font-size:.73rem;margin:13px 0 0}
    .controls{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;width:min(820px,calc(100% - 24px));display:grid;grid-template-columns:50px 1fr 50px 82px;gap:7px;padding:8px;background:rgba(20,35,31,.92);border-radius:20px;box-shadow:0 12px 35px rgba(0,0,0,.18);backdrop-filter:blur(14px)}.control{border:0;border-radius:13px;background:#fff;color:var(--ink);font-weight:950;cursor:pointer}.control.play{background:var(--accent);color:white;padding:13px}.control.speed{font-size:.72rem;line-height:1.25}.paused .memory-key,.paused .timer-line i{animation-play-state:paused}.paused .scene-card{cursor:default}
    .timing-overlay{position:fixed;inset:0;z-index:50;background:rgba(14,26,22,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;backdrop-filter:blur(5px)}.timing-sheet{width:min(620px,100%);max-height:90dvh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:0 20px 70px rgba(0,0,0,.28)}.timing-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.timing-head h2{font-size:1.55rem;margin:3px 0 4px}.timing-head p{font-size:.82rem;color:var(--muted);margin:0}.timing-close{border:1px solid var(--line);background:#edf1eb;border-radius:12px;width:40px;height:40px;font-weight:950;cursor:pointer}.preset-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:20px 0}.preset{border:1px solid var(--line);background:#f0f3ee;border-radius:14px;padding:11px 6px;font-weight:900;cursor:pointer}.preset small{display:block;color:var(--muted);font-size:.65rem;margin-top:2px}.preset.on{background:var(--accent);border-color:var(--accent);color:#fff}.preset.on small{color:#e8fff6}.timing-group{border-top:1px solid var(--line);padding:15px 0 3px}.timing-group b{display:block;margin-bottom:8px;font-size:.88rem}.choice-row{display:flex;gap:6px;flex-wrap:wrap}.choice{min-width:48px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 9px;font-size:.79rem;font-weight:850;cursor:pointer}.choice.on{color:#fff;background:var(--accent);border-color:var(--accent)}.timing-summary{margin:17px 0 10px;padding:13px 15px;background:var(--soft);border-radius:14px;color:var(--accent);font-size:.86rem;font-weight:900}.timing-apply{width:100%;border:0;border-radius:14px;padding:14px;background:var(--accent);color:#fff;font-weight:950;cursor:pointer}
    .finish{padding:42px 26px;text-align:center;margin-top:12vh}.finish .big{font-size:3rem}.finish h2{margin-bottom:10px}.finish-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}.finish button{border:0;border-radius:14px;padding:13px;font-weight:900;cursor:pointer}.finish .again{background:var(--accent);color:white}.finish .back{background:#e9ede7;color:var(--ink)}
    .hidden{display:none!important}@keyframes keyblinkDynamic{0%,75%{opacity:1;filter:none;transform:none;background:transparent}75.5%,100%{opacity:.04;filter:blur(4px);transform:scale(.97);background:var(--accent)}}@keyframes timebar{from{width:0}to{width:100%}}@keyframes enter{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
    @media(max-width:560px){.shell{padding-left:12px;padding-right:12px}.principles{grid-template-columns:1fr}.mode-actions{grid-template-columns:1fr}.scene-card{border-radius:20px;padding:22px 18px;min-height:calc(100dvh - 188px)}.fact{grid-template-columns:82px 1fr}.fact b,.fact span{padding:10px;font-size:.78rem}.memory{padding:16px 13px}.controls{grid-template-columns:46px 1fr 46px 74px}.audit{display:none}.timing-overlay{padding:8px}.timing-sheet{border-radius:22px;padding:19px 15px}.preset-row{gap:5px}.preset{font-size:.82rem}}
    @media(prefers-reduced-motion:reduce){.scene-card{animation:none}}
  </style>
</head>
<body>
  <main class="shell"><header class="top"><div class="brand">theory<i>sprint</i></div><span class="version">AUDIT 26 · INTEGRATED LEARNING FLOW</span></header><div id="app"></div></main>
  <div id="timing-overlay" class="timing-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="timing-title">
    <section class="timing-sheet" onclick="event.stopPropagation()">
      <div class="timing-head"><div><div class="eyebrow">자동 시각 암기 설정</div><h2 id="timing-title">설명 후 핵심어 회상</h2><p>먼저 장면을 읽을 시간을 주고, 핵심어를 가려 자동으로 회상시킵니다.</p></div><button class="timing-close" onclick="closeTiming()" aria-label="닫기">×</button></div>
      <div class="preset-row">
        <button class="preset" data-preset="fast" onclick="selectPreset('fast')">빠르게<small>0.8 / 0.3초 · 3회</small></button>
        <button class="preset" data-preset="normal" onclick="selectPreset('normal')">보통<small>1.5 / 0.5초 · 3회</small></button>
        <button class="preset" data-preset="focus" onclick="selectPreset('focus')">느리게<small>2 / 0.8초 · 4회</small></button>
      </div>
      <div class="timing-group"><b>보여주기</b><div class="choice-row" id="visible-choices"></div></div>
      <div class="timing-group"><b>가리기</b><div class="choice-row" id="hidden-choices"></div></div>
      <div class="timing-group"><b>반복 횟수</b><div class="choice-row" id="count-choices"></div></div>
      <div class="timing-summary" id="timing-summary"></div>
      <button class="timing-apply" onclick="applyTiming()">이 설정으로 재생</button>
    </section>
  </div>
  <script src="course-data.js"></script>
  <script src="course-data-audit02.js"></script>
  <script src="course-data-audit03.js"></script>
  <script src="course-data-audit04.js"></script>
  <script src="course-data-audit05.js"></script>
  <script src="exam-structure.js"></script>
  <script>
    THEORY_COURSES.sort((a,b)=>(a.majorOrder-b.majorOrder)||(a.subjectOrder-b.subjectOrder));
    const app=document.querySelector('#app');
    const TIMING_PRESETS={fast:{label:'빠르게',visible:800,hidden:300,count:3},normal:{label:'보통',visible:1500,hidden:500,count:3},focus:{label:'느리게',visible:2000,hidden:800,count:4}};
    const TIMING_OPTIONS={visible:[800,1000,1500,2000,3000,4000],hidden:[300,500,800,1000,1500],count:[2,3,4,5]};
    const state={course:null,mode:'core',list:[],index:0,playing:false,timingKey:'normal',timing:{...TIMING_PRESETS.normal},draftTiming:null,timer:null,started:0,remaining:0,laps:0,wake:null,settingsOpen:false};
    const storage={
      get(){try{return JSON.parse(localStorage.getItem('theorySprintAudit1')||'{"progress":{}}')}catch{return{progress:{}}}},
      set(v){localStorage.setItem('theorySprintAudit1',JSON.stringify(v))}
    };
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const mark=s=>esc(s).replace(/\[\[([\s\S]*?)\]\]/g,'<span class="memory-key">$1</span>');
    const courseBy=id=>THEORY_COURSES.find(c=>c.id===id);
    const chapters=list=>[...new Set(list.map(s=>s.chapter))];
    function recallDuration(t=state.timing){return (t.visible+t.hidden)*t.count}
    function sceneCharacters(scene){return [scene.title,scene.lead,scene.memory,...scene.rows.flat()].join(' ').replace(/\[\[|\]\]/g,'').length}
    function teachingDuration(scene,t=state.timing,key=state.timingKey){const factor=key==='fast'?.72:key==='focus'?1.35:1;const base=Math.max(3200,Math.min(9000,2800+sceneCharacters(scene)*11));return Math.round(base*factor/100)*100}
    function settlingDuration(key=state.timingKey){return key==='fast'?600:key==='focus'?1200:900}
    function timingDuration(t=state.timing,scene=state.list[state.index],key=state.timingKey){return scene?teachingDuration(scene,t,key)+recallDuration(t)+settlingDuration(key):recallDuration(t)}
    function timingLabel(){return state.timingKey==='custom'?'사용자':TIMING_PRESETS[state.timingKey].label}
    function loadTiming(){const d=storage.get(),s=d.settings;if(s&&TIMING_OPTIONS.visible.includes(s.visible)&&TIMING_OPTIONS.hidden.includes(s.hidden)&&TIMING_OPTIONS.count.includes(s.count)){state.timing={visible:s.visible,hidden:s.hidden,count:s.count};state.timingKey=s.preset&&TIMING_PRESETS[s.preset]?s.preset:'custom'}}
    function save(){const d=storage.get();d.settings={preset:state.timingKey,...state.timing};if(state.course)d.progress[state.course.id]={mode:state.mode,index:state.index,laps:state.laps,updated:Date.now()};storage.set(d)}
    async function keepAwake(){try{if('wakeLock'in navigator&&!state.wake)state.wake=await navigator.wakeLock.request('screen')}catch{}}
    async function releaseWake(){try{await state.wake?.release()}catch{}state.wake=null}
    function stopTimer(){clearTimeout(state.timer);state.timer=null}
    function progressInfo(c){const p=storage.get().progress[c.id];if(!p)return'';const total=(p.mode==='core'?c.scenes.filter(s=>s.core):c.scenes).length;return `${p.mode==='core'?'핵심':'정밀'} ${Math.min((p.index||0)+1,total)}/${total}에서 이어보기`}
    function courseCard(c,saved){return `<section class="course-card" style="--course:${c.accent}"><div class="course-head"><div><div class="course-no">세부과목 ${c.subjectOrder} · ${c.short}</div><div class="course-title">${esc(c.subject)}</div><p class="course-copy">${esc(c.summary)}</p></div><span class="audit">${c.audit.old}장 감사 → ${c.audit.rebuilt}장 재구성</span></div><div class="mode-actions"><button class="start core" onclick="startCourse('${c.id}','core')">핵심 연속 · ${c.audit.core}장</button><button class="start full" onclick="startCourse('${c.id}','full')">정밀 연속 · ${c.audit.rebuilt}장</button></div>${saved[c.id]?`<button class="resume" onclick="resumeCourse('${c.id}')">${progressInfo(c)}</button>`:''}</section>`}
    function home(){stopTimer();state.playing=false;releaseWake();document.body.classList.remove('paused');const saved=storage.get().progress;
      app.innerHTML=`<section class="hero"><div class="eyebrow">자동시각강의 · 문제풀이 아님</div><h1>설명을 먼저 보고,<br>사라진 핵심어를 떠올립니다.</h1><p class="sub">2026년 제8회 국방사업관리사 무기체계 3급 공고의 4개 대과목·17개 세부과목 체계를 따릅니다. 2025 교재를 강의 구조로 사용하고, 현행 법령·규정을 우선해 다시 만든 통합 감수본입니다.</p><div class="principles"><div class="principle"><b>분량 맞춤 설명</b><small>긴 장면은 더 오래 보여줌</small></div><div class="principle"><b>${state.timing.count}회 자동회상</b><small>${timingLabel()} · 보이기 ${state.timing.visible/1000}초</small></div><div class="principle"><b>자동 진행·탭 건너뛰기</b><small>보기만 하거나 즉시 다음</small></div></div><button class="timing-launch" onclick="openTiming()">⚙ 회상 설정 · ${timingLabel()} (회상 ${(recallDuration()/1000).toFixed(1)}초)</button></section>`+
      OFFICIAL_EXAM_STRUCTURE.map(major=>`<section class="major-group"><header class="major-head"><div><div class="major-kicker">대과목 ${major.order}</div><div class="major-title">${esc(major.title)}</div></div><span class="major-count">세부과목 ${major.courses.length}개</span></header>${major.courses.map(item=>courseBy(item.id)).filter(Boolean).map(c=>courseCard(c,saved)).join('')}</section>`).join('')+
      `<p class="method"><b>과목 체계:</b> 2026년 제8회 국방사업관리사 국가자격검정 시행계획 공고의 무기체계 3급 검정과목별 세부 출제범위를 준용했습니다. 법령과 규정은 공고가 정한 기준에 따라 최신 내용을 적용합니다.</p>`;
    }
    function startCourse(id,mode,index=0){const c=courseBy(id);state.course=c;state.mode=mode;state.list=mode==='core'?c.scenes.filter(s=>s.core):c.scenes.slice();state.index=Math.min(index,state.list.length-1);state.playing=true;state.laps=0;document.documentElement.style.setProperty('--accent',c.accent);document.documentElement.style.setProperty('--soft',c.accent+'20');keepAwake();renderScene()}
    function resumeCourse(id){const p=storage.get().progress[id];startCourse(id,p?.mode||'core',p?.index||0);state.laps=p?.laps||0;renderScene()}
    function sourceChips(scene){const by=Object.fromEntries(state.course.sources.map(s=>[s.id,s]));return scene.source.map(id=>{const s=by[id];return s?`<a class="source-chip" href="${s.url}" target="_blank" rel="noopener">${s.kind==='law'?'현행규정':'교재'} · ${esc(s.label)}</a>`:''}).join('')}
    function renderScene(){stopTimer();document.body.classList.toggle('paused',!state.playing);const scene=state.list[state.index],teach=teachingDuration(scene),recall=recallDuration(),settle=settlingDuration(),duration=teach+recall+settle,cycle=state.timing.visible+state.timing.hidden,showPct=(state.timing.visible/cycle)*100,hidePct=Math.min(99.9,showPct+.2);document.documentElement.style.setProperty('--scene-time',duration+'ms');document.documentElement.style.setProperty('--teach-time',teach+'ms');document.documentElement.style.setProperty('--blink-cycle',cycle+'ms');document.documentElement.style.setProperty('--blink-count',state.timing.count);document.querySelector('#dynamic-blink')?.remove();const style=document.createElement('style');style.id='dynamic-blink';style.textContent=`@keyframes keyblinkDynamic{0%,${showPct.toFixed(3)}%{opacity:1;filter:none;transform:none;background:transparent}${hidePct.toFixed(3)}%,100%{opacity:.04;filter:blur(4px);transform:scale(.97);background:var(--accent)}}`;document.head.append(style);const ch=chapters(state.list);
      app.innerHTML=`<div class="lecture-head"><div class="lecture-top"><button class="icon-btn" onclick="home()" aria-label="홈">⌂</button><div class="lecture-name"><b>${esc(state.course.subject)}</b><small>${state.mode==='core'?'핵심 연속':'정밀 연속'} · ${state.playing?'자동 재생':'일시정지'}</small></div><span class="count">${state.index+1} / ${state.list.length}</span></div><div class="chapter-strip">${ch.map(x=>`<span class="chapter ${x===scene.chapter?'on':''}">${esc(x)}</span>`).join('')}</div><div class="progress"><i style="width:${((state.index+1)/state.list.length)*100}%"></i></div><div class="timer-line"><i></i></div></div>
      <article class="scene-card" id="scene"><div class="scene-meta"><span class="chapter-label">${esc(scene.chapter)}</span><span class="priority">${scene.core?'핵심':'보충'} · 분량 맞춤 ${Math.round(duration/1000)}초</span></div><h2>${mark(scene.title)}</h2><p class="lead">${mark(scene.lead)}</p><div class="memory">${mark(scene.memory)}</div><div class="learning-sequence"><b>① 설명 ${(teach/1000).toFixed(1)}초</b><span>→</span><b>② 회상 ${(recall/1000).toFixed(1)}초</b><span>→</span><b>③ 복원</b></div><div class="facts">${scene.rows.map(r=>`<div class="fact"><b>${esc(r[0])}</b><span>${mark(r[1])}</span></div>`).join('')}</div><div class="source-row">${sourceChips(scene)}</div><p class="tap-hint">화면을 누르면 바로 다음 장면</p></article>
      <nav class="controls"><button class="control" onclick="previous()" aria-label="이전">←</button><button class="control play" id="play" onclick="togglePlay()">${state.playing?'잠깐 멈춤':'계속 재생'}</button><button class="control" onclick="next()" aria-label="다음">→</button><button class="control speed" onclick="openTiming()">⚙ ${timingLabel()}<br>약 ${Math.round(duration/1000)}초</button></nav>`;
      document.querySelector('#scene').addEventListener('click',e=>{if(!e.target.closest('a,button'))next()});save();state.remaining=duration;if(state.playing)schedule(duration)
    }
    function schedule(ms){stopTimer();state.remaining=ms;state.started=Date.now();state.timer=setTimeout(next,ms)}
    function togglePlay(){if(state.playing){state.remaining=Math.max(300,state.remaining-(Date.now()-state.started));stopTimer();state.playing=false;document.body.classList.add('paused');document.querySelector('#play').textContent='계속 재생'}else{state.playing=true;document.body.classList.remove('paused');document.querySelector('#play').textContent='잠깐 멈춤';schedule(state.remaining||timingDuration());keepAwake()}save()}
    function next(){if(!state.course)return;if(state.index<state.list.length-1){state.index++;renderScene()}else renderFinish()}
    function previous(){if(!state.course)return;state.index=Math.max(0,state.index-1);renderScene()}
    function openTiming(){if(state.settingsOpen)return;state.settingsOpen=true;state.draftTiming={...state.timing,key:state.timingKey};if(state.course&&state.playing){state.remaining=Math.max(300,state.remaining-(Date.now()-state.started));stopTimer();document.body.classList.add('paused')}syncTimingUI();document.querySelector('#timing-overlay').classList.remove('hidden')}
    function closeTiming(){if(!state.settingsOpen)return;state.settingsOpen=false;document.querySelector('#timing-overlay').classList.add('hidden');document.body.classList.toggle('paused',!state.playing);if(state.course&&state.playing)schedule(state.remaining||timingDuration())}
    function selectPreset(key){const p=TIMING_PRESETS[key];state.draftTiming={visible:p.visible,hidden:p.hidden,count:p.count,key};syncTimingUI()}
    function chooseTiming(kind,value){state.draftTiming[kind]=value;const match=Object.entries(TIMING_PRESETS).find(([,p])=>p.visible===state.draftTiming.visible&&p.hidden===state.draftTiming.hidden&&p.count===state.draftTiming.count);state.draftTiming.key=match?match[0]:'custom';syncTimingUI()}
    function syncTimingUI(){const d=state.draftTiming||{...state.timing,key:state.timingKey};document.querySelectorAll('[data-preset]').forEach(b=>b.classList.toggle('on',b.dataset.preset===d.key));for(const kind of ['visible','hidden','count']){document.querySelector(`#${kind}-choices`).innerHTML=TIMING_OPTIONS[kind].map(v=>`<button class="choice ${d[kind]===v?'on':''}" onclick="chooseTiming('${kind}',${v})">${kind==='count'?v+'회':v/1000+'초'}</button>`).join('')}document.querySelector('#timing-summary').textContent=`${d.key==='custom'?'사용자 설정':TIMING_PRESETS[d.key].label} · 설명시간은 카드 분량에 맞춤 · 보이기 ${d.visible/1000}초 → 가리기 ${d.hidden/1000}초 × ${d.count}회 · 회상 ${(recallDuration(d)/1000).toFixed(1)}초`}
    function applyTiming(){const d=state.draftTiming;state.timing={visible:d.visible,hidden:d.hidden,count:d.count};state.timingKey=d.key;state.settingsOpen=false;document.querySelector('#timing-overlay').classList.add('hidden');save();if(state.course)renderScene();else home()}
    function renderFinish(){stopTimer();state.laps++;save();app.innerHTML=`<section class="finish"><div class="big">✓</div><div class="eyebrow">${state.laps}회 완주</div><h2>${esc(state.course.subject)}</h2><p class="sub">4초 뒤 첫 장면부터 다시 흐릅니다. 반복할수록 장면보다 단계 간 연결을 먼저 떠올려 보세요.</p><div class="finish-actions"><button class="again" onclick="restart()">지금 다시 보기</button><button class="back" onclick="home()">과목 선택</button></div></section>`;state.index=0;state.playing=true;state.timer=setTimeout(renderScene,4000)}
    function restart(){state.index=0;state.playing=true;renderScene()}
    window.startCourse=startCourse;window.resumeCourse=resumeCourse;window.togglePlay=togglePlay;window.next=next;window.previous=previous;window.openTiming=openTiming;window.closeTiming=closeTiming;window.selectPreset=selectPreset;window.chooseTiming=chooseTiming;window.applyTiming=applyTiming;window.home=home;window.restart=restart;
    document.querySelector('#timing-overlay').addEventListener('click',closeTiming);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.settingsOpen)closeTiming()});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state.playing)keepAwake()});
    if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js');
    loadTiming();home();
  </script>
</body>
</html>
