function b64ToBytes(s){const b=atob(s),o=new Uint8Array(b.length);for(let i=0;i<b.length;i++)o[i]=b.charCodeAt(i);return o;}
async function openApp(){
 const err=document.getElementById('err'); err.textContent='';
 const pw=document.getElementById('pw').value;
 if(!pw){err.textContent='비밀번호를 입력해 주세요.';return;}
 try{
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey(
   {name:'PBKDF2',salt:b64ToBytes(SALT),iterations:ITER,hash:'SHA-256'}, km,
   {name:'AES-GCM',length:256}, false, ['decrypt']
  );
  const plain=await crypto.subtle.decrypt(
   {name:'AES-GCM',iv:b64ToBytes(NONCE),additionalData:enc.encode(AAD)}, key, b64ToBytes(CIPHERTEXT)
  );
  const app=new TextDecoder().decode(plain);
  document.open(); document.write(app); document.close();
 }catch(e){err.textContent='비밀번호가 맞지 않습니다.';}
}
document.getElementById('openBtn').onclick=openApp;
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')openApp();});
