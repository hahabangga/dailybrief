name: Next TOEIC600 English (VOA)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: toeic-refresh
  cancel-in-progress: false

jobs:
  fetch-toeic:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Archive current TOEIC and build next lesson
        run: |
          python - << 'PY'
          import os
          import re
          import glob
          import json
          import copy
          import datetime
          import requests

          from bs4 import BeautifulSoup


          # ========================================================
          # 기본 설정
          # ========================================================

          KST = datetime.timezone(
              datetime.timedelta(hours=9)
          )

          now = datetime.datetime.now(KST)

          today = now.date().isoformat()

          timestamp = now.strftime(
              "%Y-%m-%d_%H%M%S"
          )

          CURRENT_FILE = "data/toeic.json"

          ARCHIVE_DIR = "data/archive/toeic"


          os.makedirs(
              "data",
              exist_ok=True
          )

          os.makedirs(
              ARCHIVE_DIR,
              exist_ok=True
          )


          # ========================================================
          # VOA 공식 영어과정 목록
          #
          # Level 2를 먼저 사용
          # → TOEIC 600 목표에 더 적합
          #
          # Level 2 소진 시 Level 1 사용
          # ========================================================

          COURSE_PAGES = [

              "https://learningenglish.voanews.com/p/6765.html",

              "https://learningenglish.voanews.com/p/5644.html",

          ]


          BASE = (
              "https://learningenglish.voanews.com"
          )


          HEADERS = {

              "User-Agent":
                  "Mozilla/5.0 "
                  "(X11; Linux x86_64) "
                  "AppleWebKit/537.36 "
                  "Chrome/140 Safari/537.36"

          }


          # ========================================================
          # 공용
          # ========================================================

          def get(url):

              response = requests.get(
                  url,
                  headers=HEADERS,
                  timeout=30
              )

              response.raise_for_status()

              return response.text


          def clean_text(text):

              text = text or ""

              text = (
                  text
                  .replace("\u00a0", " ")
                  .replace("’", "'")
                  .replace("“", '"')
                  .replace("”", '"')
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()


          def canonical_url(url):

              if not url:
                  return ""

              url = url.split("?")[0]

              url = url.split("#")[0]

              return url.rstrip("/")


          # ========================================================
          # 웹페이지 잡문장 필터
          # ========================================================

          BLOCK_PHRASES = [

              "no media source currently available",

              "direct link",

              "embed",

              "the code has been copied",

              "download lesson",

              "download the voa learning english word book",

              "start the quiz",

              "free materials",

              "for teachers",

              "now it's your turn",

              "send us an email",

              "comments section",

              "what do you think of this lesson",

              "we want to hear from you",

              "comment system",

              "subscribe",

              "newsletter",

              "privacy policy",

              "cookie",

              "follow us",

              "all rights reserved",

              "facebook page",

          ]


          def unwanted(text):

              lower = text.lower()

              return any(
                  phrase in lower
                  for phrase in BLOCK_PHRASES
              )


          # ========================================================
          # 문장 정리
          # ========================================================

          def split_sentences(text):

              parts = re.split(
                  r"(?<=[.!?])\s+",
                  text
              )

              result = []

              seen = set()


              for sentence in parts:

                  sentence = clean_text(
                      sentence
                  )


                  if not sentence:
                      continue


                  if unwanted(
                      sentence
                  ):
                      continue


                  words = sentence.split()


                  # 너무 짧은 웹 UI 문구 제거
                  if len(words) < 4:
                      continue


                  if len(sentence) > 350:
                      continue


                  # 숫자/기호 위주 문장 제거
                  alpha_count = sum(
                      c.isalpha()
                      for c in sentence
                  )


                  if alpha_count < 5:
                      continue


                  key = sentence.lower()


                  if key in seen:
                      continue


                  seen.add(
                      key
                  )

                  result.append(
                      sentence
                  )


              return result


          # ========================================================
          # 현재 및 과거 문제 읽기
          # ========================================================

          def source_url_from_data(data):

              try:

                  return canonical_url(
                      data
                      .get("story", {})
                      .get("source_url", "")
                  )

              except Exception:

                  return ""


          current_data = None

          current_url = ""


          if os.path.exists(
              CURRENT_FILE
          ):

              try:

                  with open(
                      CURRENT_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      current_data = json.load(f)


                  current_url = (
                      source_url_from_data(
                          current_data
                      )
                  )


              except Exception as e:

                  print(
                      "Current file warning:",
                      e
                  )


          archive_files = sorted(
              glob.glob(
                  f"{ARCHIVE_DIR}/*.json"
              )
          )


          used_urls = set()


          if current_url:

              used_urls.add(
                  current_url
              )


          archive_by_url = {}


          for path in archive_files:

              try:

                  with open(
                      path,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      old = json.load(f)


                  url = source_url_from_data(
                      old
                  )


                  if url:

                      used_urls.add(
                          url
                      )

                      archive_by_url[
                          url
                      ] = path


              except Exception as e:

                  print(
                      "Archive warning:",
                      path,
                      e
                  )


          print(
              "Previously used lessons:",
              len(used_urls)
          )


          # ========================================================
          # VOA 과정 페이지에서
          # 실제 Lesson 링크만 추출
          # ========================================================

          def lesson_links_from_course(url):

              html = get(
                  url
              )

              soup = BeautifulSoup(
                  html,
                  "lxml"
              )

              results = []

              seen = set()


              for anchor in soup.find_all(
                  "a",
                  href=True
              ):

                  title = clean_text(
                      anchor.get_text(
                          " "
                      )
                  )


                  # Lesson 1:, Lesson 2: ... 만 사용
                  if not re.match(
                      r"^Lesson\s+\d+\s*:",
                      title,
                      re.IGNORECASE
                  ):
                      continue


                  href = anchor.get(
                      "href",
                      ""
                  )


                  if "/a/" not in href:
                      continue


                  if href.startswith(
                      "http"
                  ):

                      lesson_url = href


                  elif href.startswith(
                      "/"
                  ):

                      lesson_url = (
                          BASE
                          + href
                      )


                  else:

                      continue


                  lesson_url = canonical_url(
                      lesson_url
                  )


                  if lesson_url in seen:
                      continue


                  seen.add(
                      lesson_url
                  )


                  results.append({

                      "title": title,

                      "url": lesson_url,

                  })


              return results


          # ========================================================
          # Lesson 페이지에서 Conversation 부분 추출
          # ========================================================

          END_MARKERS = [

              "listening quiz",

              "quiz -",

              "start the quiz",

              "free materials",

              "for teachers",

              "comments",

              "related",

          ]


          def transcript_from_page(soup):

              # ----------------------------------------------------
              # 페이지 전체 텍스트를 줄 단위로 읽음
              #
              # VOA Lesson 페이지는
              # Conversation 아래에 실제 대화문이 위치함
              # ----------------------------------------------------

              raw = soup.get_text(
                  "\n"
              )


              lines = []


              for line in raw.splitlines():

                  line = clean_text(
                      line
                  )


                  if not line:
                      continue


                  if lines and (
                      lines[-1].lower()
                      == line.lower()
                  ):

                      continue


                  lines.append(
                      line
                  )


              # ----------------------------------------------------
              # Conversation 위치 찾기
              # ----------------------------------------------------

              start = None


              for i, line in enumerate(
                  lines
              ):

                  low = line.lower()


                  if low == "conversation":

                      start = i + 1

                      break


              # ----------------------------------------------------
              # Conversation이 있으면
              # Quiz 직전까지만 사용
              # ----------------------------------------------------

              if start is not None:

                  selected = []


                  for line in lines[start:]:

                      low = line.lower()


                      if any(
                          low.startswith(marker)
                          for marker
                          in END_MARKERS
                      ):

                          break


                      if unwanted(
                          line
                      ):
                          continue


                      selected.append(
                          line
                      )


                  text = " ".join(
                      selected
                  )


                  sentences = split_sentences(
                      text
                  )


                  if len(sentences) >= 8:

                      return sentences


              # ----------------------------------------------------
              # Conversation 마커를 못 찾으면
              # paragraph 기반 fallback
              # ----------------------------------------------------

              chunks = []


              selectors = [

                  ".wsw p",

                  ".article-content p",

                  ".article-body p",

                  "article p",

                  "main p",

              ]


              paragraphs = []


              for selector in selectors:

                  found = soup.select(
                      selector
                  )


                  if found:

                      paragraphs = found

                      break


              if not paragraphs:

                  paragraphs = soup.find_all(
                      "p"
                  )


              for p in paragraphs:

                  text = clean_text(
                      p.get_text(
                          " "
                      )
                  )


                  if not text:
                      continue


                  if unwanted(
                      text
                  ):
                      continue


                  if len(
                      text.split()
                  ) < 4:

                      continue


                  chunks.append(
                      text
                  )


              return split_sentences(
                  " ".join(
                      chunks
                  )
              )


          # ========================================================
          # Lesson 하나 분석
          # ========================================================

          def extract_lesson(url):

              html = get(
                  url
              )


              soup = BeautifulSoup(
                  html,
                  "lxml"
              )


              h1 = soup.find(
                  "h1"
              )


              title = (
                  clean_text(
                      h1.get_text(
                          " "
                      )
                  )
                  if h1
                  else ""
              )


              if not title:

                  title_tag = soup.find(
                      "title"
                  )


                  title = (
                      clean_text(
                          title_tag.get_text(
                              " "
                          )
                      )
                      if title_tag
                      else "VOA Lesson"
                  )


              sentences = (
                  transcript_from_page(
                      soup
                  )
              )


              # 최대 18문장
              return (
                  title,
                  sentences[:18]
              )


          # ========================================================
          # 모든 Lesson 후보 만들기
          # ========================================================

          candidates = []


          for course_page in COURSE_PAGES:

              try:

                  lessons = (
                      lesson_links_from_course(
                          course_page
                      )
                  )


                  print(
                      "Course:",
                      course_page,
                      "lessons:",
                      len(lessons)
                  )


                  candidates.extend(
                      lessons
                  )


              except Exception as e:

                  print(
                      "Course failed:",
                      course_page,
                      e
                  )


          # URL 기준 중복 제거
          unique_candidates = []

          candidate_seen = set()


          for item in candidates:

              url = canonical_url(
                  item["url"]
              )


              if url in candidate_seen:
                  continue


              candidate_seen.add(
                  url
              )

              item["url"] = url

              unique_candidates.append(
                  item
              )


          print(
              "Total lesson candidates:",
              len(
                  unique_candidates
              )
          )


          # ========================================================
          # 이미 학습한 Lesson 제외
          # ========================================================

          unused = [

              item
              for item
              in unique_candidates

              if item["url"]
              not in used_urls

          ]


          print(
              "Unused lessons:",
              len(unused)
          )


          # ========================================================
          # 다음 문제 선택
          # ========================================================

          selected_url = None

          selected_title = None

          selected_lines = None


          for item in unused:

              try:

                  title, lines = (
                      extract_lesson(
                          item["url"]
                      )
                  )


                  print(
                      "Candidate:",
                      title[:70],
                      "| sentences:",
                      len(lines)
                  )


                  if len(lines) < 8:

                      continue


                  selected_url = (
                      item["url"]
                  )

                  selected_title = title

                  selected_lines = lines

                  break


              except Exception as e:

                  print(
                      "Lesson failed:",
                      item["url"],
                      e
                  )


          # ========================================================
          # 새 문제를 못 찾으면
          # 현재 문제를 건드리지 않고 실패
          # ========================================================

          if (
              not selected_url
              or not selected_lines
              or len(selected_lines) < 8
          ):

              raise RuntimeError(
                  "No unused VOA lesson with "
                  "at least 8 usable sentences was found."
              )


          print("")
          print(
              "Selected:",
              selected_title
          )

          print(
              "URL:",
              selected_url
          )

          print(
              "Sentences:",
              len(selected_lines)
          )


          # ========================================================
          # 새 문제 확보 성공 후에만
          # 현재 문제를 완료 archive 처리
          # ========================================================

          if current_data:

              archived = copy.deepcopy(
                  current_data
              )


              archived[
                  "status"
              ] = "completed"


              archived[
                  "completed_at_kst"
              ] = now.isoformat()


              # ----------------------------------------------------
              # 동일 source_url archive가 이미 있으면
              # 새 파일을 만들지 않고 갱신
              # ----------------------------------------------------

              if (
                  current_url
                  and current_url
                  in archive_by_url
              ):

                  archive_path = (
                      archive_by_url[
                          current_url
                      ]
                  )


              else:

                  archive_path = (
                      f"{ARCHIVE_DIR}/"
                      f"{timestamp}.json"
                  )


              with open(
                  archive_path,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      archived,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )


              print(
                  "Archived current lesson:",
                  archive_path
              )


          # ========================================================
          # 새 현재 문제 생성
          # ========================================================

          new_data = {

              "date":
                  today,

              "created_at_kst":
                  now.isoformat(),

              "status":
                  "current",

              "type":
                  "toeic600",

              "source":
                  "VOA Learning English",

              "story": {

                  "title":
                      f"VOA: {selected_title[:120]}",

                  "source_url":
                      selected_url,

                  "lines": [

                      {
                          "en": sentence
                      }

                      for sentence
                      in selected_lines

                  ]

              }

          }


          with open(
              CURRENT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  new_data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print(
              "======================================"
          )

          print(
              "NEW TOEIC READY"
          )

          print(
              "======================================"
          )

          print(
              new_data[
                  "story"
              ][
                  "title"
              ]
          )

          print(
              "Sentence count:",
              len(
                  selected_lines
              )
          )

          PY

      - name: Validate TOEIC data
        run: |
          python - << 'PY'
          import json

          with open(
              "data/toeic.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          lines = (
              data
              .get("story", {})
              .get("lines", [])
          )

          url = (
              data
              .get("story", {})
              .get("source_url", "")
          )

          if len(lines) < 8:
              raise SystemExit(
                  "toeic.json has fewer than 8 sentences"
              )

          if not url:
              raise SystemExit(
                  "toeic.json has no source_url"
              )

          print(
              "Validation OK:",
              len(lines),
              "sentences"
          )
          PY

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            data/toeic.json \
            data/archive/toeic/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit \
              -m "chore(toeic): archive completed lesson and create next [skip ci]"

            git push
          fi
