            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "github-actions[bot]@users.noreply.github.com"


          git add \
            data/toeic.json \
            data/archive/toeic/


          if git diff --cached --quiet; then

            echo "No changes to commit"

          else

            git commit \
              -m "chore(data): refresh TOEIC600 VOA data [skip ci]"

            git push

          fi
