name: Weekly TOEIC600 English (VOA)

on:
  schedule:
    # 매주 월요일 00:05 UTC = 한국 09:05 KST
    - cron: "5 0 * * 1"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-toeic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml


      - name: Build weekly TOEIC data
        run: |
          python - << 'PY'

          import os
          import re
          import json
          import datetime
          import requests

          from bs4 import BeautifulSoup


          # ========================================================
          # VOA Learning English
          # ========================================================

          SOURCES = [

              "https://learningenglish.voanews.com/z/1689",

              "https://learningenglish.voanews.com/p/5609.html",

          ]


          BASE = (
              "https://learningenglish.voanews.com"
          )


          headers = {

              "User-Agent":
                  "Mozilla/5.0 "
                  "(X11; Linux x86_64) "
                  "GitHubActions/Toeic600/2.0"

          }


          # ========================================================
          # 요청
          # ========================================================

          def get(url):

              response = requests.get(
                  url,
                  headers=headers,
                  timeout=30
              )

              response.raise_for_status()

              return response.text


          # ========================================================
          # 텍스트 정리
          # ========================================================

          def clean_text(text):

              return re.sub(
                  r"\s+",
                  " ",
                  text or ""
              ).strip()


          # ========================================================
          # 기사 링크 후보
          # ========================================================

          def find_article_links(html):

              soup = BeautifulSoup(
                  html,
                  "lxml"
              )

              results = []

              seen = set()


              for anchor in soup.find_all(
                  "a",
                  href=True
              ):

                  href = anchor[
                      "href"
                  ]


                  if "/a/" not in href:
                      continue


                  if href.startswith(
                      "http"
                  ):

                      url = href

                  elif href.startswith(
                      "/"
                  ):

                      url = (
                          BASE
                          + href
                      )

                  else:
                      continue


                  if url in seen:
                      continue


                  seen.add(url)

                  results.append(
                      url
                  )


              return results


          # ========================================================
          # 제거할 불필요 문구
          # ========================================================

          BLOCK_PHRASES = [

              "no media source currently available",

              "what do you think of this lesson",

              "we want to hear from you",

              "comment system",

              "each time you return to comment",

              "subscribe",

              "share",

              "download",

              "rss",

              "privacy policy",

              "cookie",

              "follow us",

          ]


          def unwanted(text):

              lower = (
                  text
                  .lower()
              )


              return any(
                  phrase in lower
                  for phrase in BLOCK_PHRASES
              )


          # ========================================================
          # 문장 분리
          # ========================================================

          def split_sentences(text):

              sentences = re.split(
                  r"(?<=[.!?])\s+",
                  text
              )


              result = []

              seen = set()


              for sentence in sentences:

                  sentence = (
                      clean_text(
                          sentence
                      )
                  )


                  if not sentence:
                      continue


                  if len(
                      sentence.split()
                  ) < 4:
                      continue


                  if len(sentence) > 350:
                      continue


                  if unwanted(
                      sentence
                  ):
                      continue


                  key = sentence.lower()


                  if key in seen:
                      continue


                  seen.add(key)

                  result.append(
                      sentence
                  )


              return result


          # ========================================================
          # 기사 본문 추출
          # ========================================================

          def extract_article(url):

              html = get(
                  url
              )


              soup = BeautifulSoup(
                  html,
                  "lxml"
              )


              title = ""

              h1 = soup.find(
                  "h1"
              )


              if h1:

                  title = clean_text(
                      h1.get_text(
                          " "
                      )
                  )


              if not title:

                  title_tag = soup.find(
                      "title"
                  )


                  if title_tag:

                      title = clean_text(
                          title_tag
                          .get_text(
                              " "
                          )
                      )


              # ----------------------------------------------------
              # 본문 후보
              # ----------------------------------------------------

              selectors = [

                  "article p",

                  ".wsw p",

                  ".article-content p",

                  "main p",

              ]


              paragraphs = []


              for selector in selectors:

                  found = soup.select(
                      selector
                  )


                  if found:

                      paragraphs = found

                      break


              if not paragraphs:

                  paragraphs = (
                      soup.find_all(
                          "p"
                      )
                  )


              chunks = []


              for p in paragraphs:

                  text = clean_text(
                      p.get_text(
                          " "
                      )
                  )


                  if not text:
                      continue


                  if unwanted(
                      text
                  ):
                      continue


                  if len(
                      text.split()
                  ) < 5:
                      continue


                  chunks.append(
                      text
                  )


              sentences = []


              for chunk in chunks:

                  sentences.extend(
                      split_sentences(
                          chunk
                      )
                  )


              # 최대 18문장
              sentences = (
                  sentences[:18]
              )


              return (
                  title,
                  sentences
              )


          # ========================================================
          # 여러 기사 중 학습 가능한 기사 선택
          # ========================================================

          article_url = None

          final_title = None

          final_lines = None


          candidate_urls = []


          for source in SOURCES:

              try:

                  html = get(
                      source
                  )

                  candidate_urls.extend(
                      find_article_links(
                          html
                      )
                  )

              except Exception as e:

                  print(
                      "Source failed:",
                      source,
                      e
                  )


          # 중복 제거
          candidate_urls = list(
              dict.fromkeys(
                  candidate_urls
              )
          )


          print(
              "Candidate articles:",
              len(
                  candidate_urls
              )
          )


          # 최신 후보 최대 20개 검사
          for url in candidate_urls[:20]:

              try:

                  title, lines = (
                      extract_article(
                          url
                      )
                  )


                  print(
                      "Candidate:",
                      title[:60],
                      "sentences:",
                      len(lines)
                  )


                  if len(lines) >= 8:

                      article_url = (
                          url
                      )

                      final_title = (
                          title
                      )

                      final_lines = (
                          lines
                      )

                      break


              except Exception as e:

                  print(
                      "Article failed:",
                      url,
                      e
                  )


          # ========================================================
          # 제대로 된 자료가 없으면 성공으로 위장하지 않음
          # ========================================================

          if (
              not article_url
              or not final_lines
              or len(
                  final_lines
              ) < 8
          ):

              raise RuntimeError(
                  "No usable VOA article with at least 8 learning sentences was found."
              )


          # ========================================================
          # 한국 날짜
          # ========================================================

          KST = datetime.timezone(
              datetime.timedelta(
                  hours=9
              )
          )


          today = (
              datetime.datetime
              .now(KST)
              .date()
              .isoformat()
          )


          # ========================================================
          # TOEIC 전용 JSON
          # ========================================================

          out = {

              "date":
                  today,

              "type":
                  "toeic600",

              "source":
                  "VOA Learning English",

              "story": {

                  "title":
                      f"VOA: {final_title[:100]}",

                  "source_url":
                      article_url,

                  "lines": [
                      {
                          "en": sentence
                      }
                      for sentence
                      in final_lines
                  ]

              }

          }


          # ========================================================
          # 일반 story와 완전히 다른 파일 사용
          # ========================================================

          os.makedirs(
              "data",
              exist_ok=True
          )

          os.makedirs(
              "data/archive/toeic",
              exist_ok=True
          )


          with open(
              "data/toeic.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  out,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          archive_path = (
              f"data/archive/toeic/{today}.json"
          )


          with open(
              archive_path,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  out,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "SUCCESS"
          )

          print(
              "Title:",
              out["story"]["title"]
          )

          print(
              "URL:",
              article_url
          )

          print(
              "Sentences:",
              len(
                  out["story"]["lines"]
              )
          )

          print(
              "Archive:",
              archive_path
          )

          PY


      - name: Commit & push
        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "github-actions[bot]@users.noreply.github.com"


          git add \
            data/toeic.json \
            data/archive/toeic/


          if git diff --cached --quiet; then

            echo "No changes to commit"

          else

            git commit \
              -m "chore(data): refresh TOEIC600 VOA data [skip ci]"

            git push

          fi
