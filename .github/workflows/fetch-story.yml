name: Weekly story update (public domain)

on:
  schedule:
    # 매주 월요일 00:00 UTC = 한국 09:00 KST
    - cron: "0 0 * * 1"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-story:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch public-domain story
        run: |
          python - << 'PY'

          import os
          import re
          import json
          import random
          import datetime
          import requests

          URL = "https://www.gutenberg.org/cache/epub/11339/pg11339.txt"

          headers = {
              "User-Agent":
                  "Mozilla/5.0 GitHubActions/DailyBriefStory/1.0"
          }

          response = requests.get(
              URL,
              headers=headers,
              timeout=30
          )

          response.raise_for_status()

          text = response.text


          # ========================================================
          # 적당한 길이의 문단만 후보로 사용
          # ========================================================

          parts = [
              p.strip()
              for p in re.split(
                  r"\n\s*\n",
                  text
              )
              if (
                  30
                  <= len(p.strip().split())
                  <= 350
              )
          ]


          if not parts:
              raise RuntimeError(
                  "No usable public-domain story was found."
              )


          # ========================================================
          # 이야기 하나 선택
          # ========================================================

          story = random.choice(parts)


          sentences = re.split(
              r"(?<=[.!?])\s+",
              story
          )


          usable = [
              sentence.strip()
              for sentence in sentences
              if (
                  len(
                      sentence
                      .strip()
                      .split()
                  )
                  >= 4
              )
          ]


          pick = usable[:15]


          if len(pick) < 3:
              raise RuntimeError(
                  "Selected story has too few usable sentences."
              )


          # ========================================================
          # 한국 날짜
          # ========================================================

          KST = datetime.timezone(
              datetime.timedelta(
                  hours=9
              )
          )


          today = (
              datetime.datetime
              .now(KST)
              .date()
              .isoformat()
          )


          # ========================================================
          # JSON
          # ========================================================

          title = pick[0][:80]

          if len(pick[0]) > 80:
              title += "..."


          out = {

              "date":
                  today,

              "type":
                  "public_domain_story",

              "source":
                  "Project Gutenberg - Aesop's Fables",

              "source_url":
                  URL,

              "story": {

                  "title":
                      title,

                  "lines": [
                      {
                          "en": sentence
                      }
                      for sentence in pick
                  ]

              }

          }


          # ========================================================
          # 저장 폴더
          # ========================================================

          os.makedirs(
              "data",
              exist_ok=True
          )

          os.makedirs(
              "data/archive/story",
              exist_ok=True
          )


          # ========================================================
          # 최신 파일
          # ========================================================

          with open(
              "data/story.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  out,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          # ========================================================
          # 일반 Story 전용 Archive
          # ========================================================

          archive_path = (
              f"data/archive/story/{today}.json"
          )


          with open(
              archive_path,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  out,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "SUCCESS"
          )

          print(
              "Story:",
              out["story"]["title"]
          )

          print(
              "Sentences:",
              len(
                  out["story"]["lines"]
              )
          )

          print(
              "Archive:",
              archive_path
          )

          PY


      - name: Commit & push
        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "github-actions[bot]@users.noreply.github.com"


          git add \
            data/story.json \
            data/archive/story/


          if git diff --cached --quiet; then

            echo "No changes to commit"

          else

            git commit \
              -m "chore(data): refresh weekly public-domain story [skip ci]"

            git push

          fi
          # 무작위로 한 이야기 선택
          story = random.choice(parts)

          # 문장 단위로 나누기 (마침표, 느낌표, 물음표 기준)
          sentences = re.split(r'(?<=[.!?])\s+', story)
          # 앞에서 10~15문장만 가져오기
          pick = sentences[:15]

          out = {
              "date": datetime.date.today().isoformat(),
              "story": {
                  "title": pick[0][:50] + "...",  # 첫 문장 일부를 제목으로
                  "lines": [{"en": s.strip()} for s in pick if s.strip()]
              }
          }

          os.makedirs("data", exist_ok=True)
          os.makedirs("data/archive", exist_ok=True)

          # 이번 주 이야기 저장
          with open("data/story.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False,indent=2)

          # 아카이브 저장
          with open(f"data/archive/{out['date']}.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False,indent=2)

          print("Saved story for", out["date"], ":", out["story"]["title"])
          PY

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(data): weekly public domain story update [skip ci]"
            git push
          fi
