      if(typeof THEORY_COURSES==='undefined') return null;
      for(const course of THEORY_COURSES){

      return null;
    };
    const set=(id,fn)=>{const hit=getScene(id);if(!hit)return false;fn(hit.scene,hit.course);return true;};

      s.lead='연구개발사업이 [[36개월 이상 AND 100억원 이상 AND 개산계약 또는 협약]]이면 기본 적용대상이다. 다만 사업관리기관이 사업관리 효율성과 특성을 고려하여 적용 여부를 판단한다.';
      s.memory='[[36개월 ∧ 100억원 ∧ (개산계약 ∨ 협약) / 기관 판단]]';

      s.lead='CAIV는 [[36개월 이상 OR 총사업비 관리대상]]인 무기체계 탐색·체계개발사업에 원칙적으로 적용한다. EVMS처럼 세 조건을 모두 요구하는 기준이 아니다.';

    window.__CURRENT_DIRECTIVE_HOTFIX__={version:'2026.23',applied};
    if(typeof home==='function') home();
  })();`;

  function getSanitizedPreviousPatch(){
    try{
      const patch=source.contentWindow.eval('PATCH');
      if(typeof patch!=='string') return null;
      return patch.replace(/\n  \/\/ 표현 통일:[\s\S]*?\n  const badge=/,'\n  const badge=');
    }catch(_){return null;}
  }
  function inject(code){
    const d=app.contentDocument;
    if(!d||!d.body)return false;
    const script=d.createElement('script');script.textContent=code;d.body.appendChild(script);return true;
  }
  function apply(){
    try{
      const d=app.contentDocument;
      if(!d||!d.body||typeof app.contentWindow.THEORY_COURSES==='undefined')return false;
      const previous=getSanitizedPreviousPatch();
      if(!previous)return false;
      inject(previous);inject(OVERRIDE);
      const ok=d.documentElement.dataset.currentDirectiveHotfix==='2026-09-27-23';
      status.textContent=ok?'2026.23 확정패치 적용 완료':'2026.23 적용 상태 확인 필요';
      if(ok)setTimeout(()=>status.remove(),2400);
      return ok;
    }catch(_){status.textContent='같은 도메인에 업로드하면 확정패치가 적용됩니다.';return false;}
  }
  let tries=0;
  function retry(){if(apply())return;if(++tries<20)setTimeout(retry,250);}
  app.addEventListener('load',()=>setTimeout(retry,250));
  source.addEventListener('load',()=>setTimeout(retry,250));
  setTimeout(retry,900);
})();
</script>
